apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-status-api-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/acme/devops-home-assignment.git
    targetRevision: main
    path: helm/application
    helm:
      valueFiles:
        - ../../environments/dev/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
