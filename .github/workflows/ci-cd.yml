name: CI-CD

on:
  pull_request:
  push:
    branches: [main]

permissions: write-all

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: npm test

      - name: Helm lint
        run: helm lint helm/application

      - name: Render Helm
        run: helm template application helm/application -f environments/dev/values.yaml

      - name: Build image
        run: docker build -t ghcr.io/acme/platform-status-api:latest .

      - name: Login to registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push image
        run: docker push ghcr.io/acme/platform-status-api:latest

      - name: Deploy application
        run: |
          helm upgrade --install platform-status-api helm/application \
            --namespace platform \
            --create-namespace \
            -f environments/prod/values.yaml
