name: CI CD

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: npm test

      - name: Helm lint
        run: helm lint helm/application

      - name: Helm template (dev)
        run: helm template application helm/application -f environments/dev/values.yaml

      - name: Helm template (prod)
        run: helm template application helm/application -f environments/prod/values.yaml

  build-and-push:
    runs-on: ubuntu-24.04
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push image
        run: |
          docker build \
            -t ghcr.io/acme/platform-status-api:${{ github.sha }} \
            -t ghcr.io/acme/platform-status-api:latest \
            .
          docker push ghcr.io/acme/platform-status-api:${{ github.sha }}
          docker push ghcr.io/acme/platform-status-api:latest
